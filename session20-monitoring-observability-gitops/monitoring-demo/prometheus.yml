global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node-exporter          # host/VM CPU, memory, disk
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor               # per-container CPU / memory
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: app-health             # application health through the blackbox exporter (HTTP probe)
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://demo-app:80/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
