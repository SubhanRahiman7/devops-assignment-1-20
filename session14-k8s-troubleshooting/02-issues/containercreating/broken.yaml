# Pod stays in ContainerCreating: it mounts a ConfigMap that does not exist
apiVersion: v1
kind: Pod
metadata:
  name: creating-demo
spec:
  containers:
    - name: app
      image: nginx:1.27
      volumeMounts:
        - name: cfg
          mountPath: /etc/app
  volumes:
    - name: cfg
      configMap:
        name: missing-config
