<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker>
  </defs>
  <rect width="1100" height="680" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b2a41">Session 19 – Terraform-managed AWS infrastructure</text>

  <!-- Terraform -->
  <rect x="30" y="90" width="210" height="300" rx="10" fill="#f3e8ff" stroke="#7b42bc" stroke-width="2"/>
  <text x="135" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#5c2d91">Terraform</text>
  <text x="135" y="140" text-anchor="middle" font-size="12" fill="#444">laptop / CI pipeline</text>
  <rect x="50" y="158" width="170" height="26" rx="4" fill="#fff" stroke="#b39ddb"/><text x="135" y="176" text-anchor="middle" font-size="13" fill="#333">providers.tf</text>
  <rect x="50" y="190" width="170" height="26" rx="4" fill="#fff" stroke="#b39ddb"/><text x="135" y="208" text-anchor="middle" font-size="13" fill="#333">variables.tf / tfvars</text>
  <rect x="50" y="222" width="170" height="26" rx="4" fill="#fff" stroke="#b39ddb"/><text x="135" y="240" text-anchor="middle" font-size="13" fill="#333">main.tf (resources)</text>
  <rect x="50" y="254" width="170" height="26" rx="4" fill="#fff" stroke="#b39ddb"/><text x="135" y="272" text-anchor="middle" font-size="13" fill="#333">outputs.tf</text>
  <rect x="50" y="300" width="170" height="30" rx="4" fill="#ede7f6" stroke="#7b42bc" stroke-dasharray="4 3"/><text x="135" y="320" text-anchor="middle" font-size="13" fill="#4a148c">terraform.tfstate</text>
  <text x="135" y="360" text-anchor="middle" font-size="12" fill="#444">init · plan · apply · destroy</text>

  <line x1="240" y1="240" x2="300" y2="240" stroke="#37474f" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="270" y="228" text-anchor="middle" font-size="11" fill="#37474f">AWS API</text>

  <!-- Internet -->
  <ellipse cx="640" cy="92" rx="110" ry="30" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="640" y="97" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">Internet</text>

  <!-- Region -->
  <rect x="300" y="140" width="770" height="510" rx="12" fill="#fafafa" stroke="#546e7a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="318" y="164" font-size="14" font-weight="bold" fill="#455a64">AWS Region  ap-south-1 (Mumbai)</text>

  <!-- IGW -->
  <rect x="540" y="176" width="200" height="34" rx="6" fill="#ffe0b2" stroke="#ef6c00" stroke-width="2"/>
  <text x="640" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">Internet Gateway</text>
  <line x1="640" y1="122" x2="640" y2="176" stroke="#37474f" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- VPC -->
  <rect x="320" y="220" width="520" height="410" rx="10" fill="#f1f8e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="338" y="244" font-size="14" font-weight="bold" fill="#1b5e20">VPC  10.20.0.0/16  (session19-vpc)</text>
  <line x1="640" y1="210" x2="640" y2="268" stroke="#37474f" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Route table -->
  <rect x="345" y="262" width="230" height="64" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="460" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#8d6e00">Route table (public)</text>
  <text x="460" y="304" text-anchor="middle" font-size="12" fill="#444">10.20.0.0/16 → local</text>
  <text x="460" y="319" text-anchor="middle" font-size="12" fill="#444">0.0.0.0/0 → Internet Gateway</text>
  <line x1="575" y1="294" x2="640" y2="294" stroke="#f9a825" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- Subnet -->
  <rect x="345" y="350" width="470" height="260" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="362" y="372" font-size="13" font-weight="bold" fill="#2e7d32">Public subnet  10.20.1.0/24   (AZ ap-south-1a)</text>
  <line x1="460" y1="326" x2="460" y2="350" stroke="#f9a825" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- Security group -->
  <rect x="385" y="392" width="390" height="190" rx="8" fill="none" stroke="#d32f2f" stroke-width="2.5" stroke-dasharray="9 5"/>
  <text x="400" y="414" font-size="13" font-weight="bold" fill="#c62828">Security group  session19-web-sg</text>
  <text x="400" y="432" font-size="12" fill="#444">in: 80/443 from 0.0.0.0/0 · 22 from ssh_cidr   out: all</text>
  <!-- EC2 -->
  <rect x="440" y="452" width="280" height="110" rx="8" fill="#fff" stroke="#ff9900" stroke-width="3"/>
  <text x="580" y="482" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100">EC2 instance</text>
  <text x="580" y="504" text-anchor="middle" font-size="12" fill="#444">t3.micro · Amazon Linux 2023</text>
  <text x="580" y="522" text-anchor="middle" font-size="12" fill="#444">user_data: nginx "Hello from Terraform"</text>
  <text x="580" y="546" text-anchor="middle" font-size="12" fill="#444">public IP (auto) · private IP 10.20.1.x</text>

  <!-- S3 -->
  <rect x="870" y="330" width="170" height="130" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/>
  <text x="955" y="364" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a237e">S3 bucket</text>
  <text x="955" y="388" text-anchor="middle" font-size="12" fill="#444">artifacts</text>
  <text x="955" y="408" text-anchor="middle" font-size="12" fill="#444">versioning: Enabled</text>
  <text x="955" y="426" text-anchor="middle" font-size="12" fill="#444">public access: blocked</text>
  <text x="955" y="446" text-anchor="middle" font-size="11" fill="#666">(regional service, outside the VPC)</text>
  <line x1="720" y1="507" x2="870" y2="420" stroke="#3949ab" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="810" y="480" font-size="11" fill="#3949ab">uses (via IAM role / endpoint)</text>

  <!-- dependency legend -->
  <text x="330" y="642" font-size="12" fill="#37474f">Terraform dependency order:  VPC → subnet + IGW → route table → association → security group → EC2   (S3 independent)</text>
</svg>
