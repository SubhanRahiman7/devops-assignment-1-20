# CreateContainerConfigError: env var references a ConfigMap key that does not exist
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-settings
data:
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo LOG_LEVEL=$LOG_LEVEL DB_HOST=$DB_HOST; sleep 3600"]
      env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef: { name: app-settings, key: LOG_LEVEL }
        - name: DB_HOST
          valueFrom:
            configMapKeyRef: { name: app-settings, key: DB_HOST }   # key missing!
