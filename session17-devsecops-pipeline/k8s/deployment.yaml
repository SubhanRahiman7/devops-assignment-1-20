apiVersion: apps/v1
kind: Deployment
metadata:
  name: session17-devsecops
  labels:
    app: session17-devsecops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session17-devsecops
  template:
    metadata:
      labels:
        app: session17-devsecops
    spec:
      imagePullSecrets:
        - name: ghcr-creds            # created by the pipeline (the GHCR package is private)
      containers:
        - name: app
          image: __IMAGE__            # replaced by the pipeline: ghcr.io/<owner>/session17-devsecops:<git sha>
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          readinessProbe:
            httpGet: { path: /health, port: 5001 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
